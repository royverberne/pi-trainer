<style>
/* Opzet: gradient-kop met merkicoon, witte kaarten op lichtblauw met grote zachte cirkels (cirkels = π),
   één oranje hoofdactie per scherm, cijfers altijd in vaste breedte, logo in de voettekst. */
:root {
  --navy: #143057;
  --blauw: #2b6c9e;
  --blauw-donker: #143057;
  --cyaan: #4cb8de;
  --cyaan-licht: #e4f4fb;
  --accent: #2380b3;
  --accent-donker: #16577f;
  --accent-licht: #e6f4fb;
  --accent-rand: #b8def0;

  --achtergrond: #eaf3f9;
  --wit: #ffffff;
  --tekst: #142a47;
  --tekst-zacht: #4a6178;
  --rand-licht: #cfe4f1;
  --link: #2b6c9e;
  --cirkel: rgba(76, 184, 222, 0.14);
  --op-kleur: #ffffff;
  --logo-vlak: #ffffff;
  --voet-tekst: #4a6178; /* staat altijd op het lichte logovlak */
  --voet-vlak: rgba(255, 255, 255, 0.6);

  --groen: #1f9d47; --groen-donker: #167535; --groen-licht: #dcf7e4;
  --rood: #e0313b; --rood-licht: #fde3e4;
  --oranje: #ff8a00; --oranje-donker: #c96a00;
  --geel: #ffc93c; --geel-licht: #fff4d1;
  --goud: #c9a227;

  /* Badges: metaal blijft in beide thema's gelijk */
  --goud-licht: #f7df86;
  --goud-donker: #8f6f0e;
  --zilver: #b9c4ce;
  --zilver-licht: #f2f5f8;
  --zilver-donker: #6f7c89;
  --badge-tekst: #143057;
  --zilver-vlak: #eaeff4;   /* doel gehaald als π Student */

  /* Grafsteen van Ludolph */
  --steen: #d9dee3;
  --steen-donker: #a3acb6;
  --steen-tekst: #2c3640;

  --radius: 22px;
  --schaduw-zacht: 0 8px 24px rgba(20, 48, 87, 0.12);
  /* STIX staat voorop maar bevat alleen het π-teken: π wordt klassiek, alle andere tekens blijven Nunito */
  --font: "STIX Two Text", "Nunito", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  --font-pi: "STIX Two Text", "Times New Roman", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cyaan-licht: #173a55; --accent-licht: #16344d; --accent-rand: #2b5877;
    --achtergrond: #0d1b2e; --wit: #15283f;
    --tekst: #e8f1f8; --tekst-zacht: #9db4c8; --rand-licht: #2a4463;
    --link: #6bc3e6; --cirkel: rgba(76, 184, 222, 0.1);
    --groen-licht: #123b25; --rood-licht: #4a1e22; --geel-licht: #4a3d14;
    --steen: #3a4450; --steen-donker: #232b34; --steen-tekst: #e3e8ed;
    --schaduw-zacht: 0 8px 24px rgba(0, 0, 0, 0.4);
    --voet-vlak: transparent;
    --voet-tekst: #9db4c8;
    --zilver-vlak: #2b3542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cyaan-licht: #173a55; --accent-licht: #16344d; --accent-rand: #2b5877;
  --achtergrond: #0d1b2e; --wit: #15283f;
  --tekst: #e8f1f8; --tekst-zacht: #9db4c8; --rand-licht: #2a4463;
  --link: #6bc3e6; --cirkel: rgba(76, 184, 222, 0.1);
  --groen-licht: #123b25; --rood-licht: #4a1e22; --geel-licht: #4a3d14;
  --steen: #3a4450; --steen-donker: #232b34; --steen-tekst: #e3e8ed;
  --schaduw-zacht: 0 8px 24px rgba(0, 0, 0, 0.4);
  --voet-vlak: transparent;
  --voet-tekst: #9db4c8;
  --zilver-vlak: #2b3542;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--achtergrond); }
body {
  background: var(--achtergrond);
  color: var(--tekst);
  font-family: var(--font);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3 { font-weight: 900; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font-family: var(--font); }
:focus-visible { outline: 4px solid var(--cyaan); outline-offset: 3px; }
/* Grote zachte π-tekens op de achtergrond (in plaats van de cirkels) */
.achtergrond-pi { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.achtergrond-pi span { position: absolute; color: var(--cirkel); font-family: var(--font-pi); font-weight: 700; line-height: 1; user-select: none; }
.achtergrond-pi span:nth-child(1) { font-size: 380px; top: 90px; right: -60px; transform: rotate(12deg); }
.achtergrond-pi span:nth-child(2) { font-size: 520px; top: 38%; left: -120px; transform: rotate(-10deg); }
.achtergrond-pi span:nth-child(3) { font-size: 260px; bottom: -60px; right: 22%; transform: rotate(6deg); }
.kop, .pagina, .voet { position: relative; z-index: 1; }
@media (max-width: 560px) {
  .achtergrond-pi span:nth-child(1) { font-size: 240px; }
  .achtergrond-pi span:nth-child(2) { font-size: 320px; left: -90px; }
  .achtergrond-pi span:nth-child(3) { font-size: 180px; }
}
/* Klassieke π in lopende tekst: STIX oogt kleiner dan Nunito, daarom iets groter */
.pi { font-family: var(--font-pi); font-weight: 700; font-size: 1.25em; line-height: 0.8; text-transform: none; letter-spacing: 0; } /* nooit hoofdletter-Π in labels */
/* Openingsscherm, zoals bij de Topo Trainer (altijd wit, want het logo staat op wit) */
#splash { position: fixed; inset: 0; z-index: 60; background: #ffffff; display: grid; place-items: center; transition: opacity 0.6s ease, visibility 0.6s; cursor: pointer; }
#splash.weg { opacity: 0; visibility: hidden; }
#splash .sp { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 20px; }
#splash .sp-titel { font: 900 clamp(30px, 7vw, 42px)/1 var(--font); color: #143057; letter-spacing: -0.01em; }
#splash .sp-van { font-weight: 700; color: #4a6178; font-size: 15px; letter-spacing: 0.04em; margin-top: 6px; }
#splash img { width: min(130px, 31vw); height: auto; animation: opkomen 0.8s cubic-bezier(.2,.8,.2,1) both; }
#splash img.sp-icoon { width: 104px; height: 104px; border-radius: 50%; box-shadow: 0 8px 24px rgba(20, 48, 87, 0.22); margin-bottom: 4px; animation-duration: 0.6s; }
@keyframes opkomen { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cijfers { font-variant-numeric: tabular-nums; }

/* ---------- Kop ---------- */
.kop { background: linear-gradient(120deg, var(--navy) 0%, var(--blauw) 58%, var(--cyaan) 100%); color: var(--op-kleur); }
.kop-binnen {
  max-width: 1100px; margin-inline: auto; padding-inline: 16px; padding-block: 16px;
  display: flex; align-items: center; gap: 12px;
}
.kop-titel { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-align: left; }
.pi-teken {
  flex: none; width: clamp(56px, 11vw, 76px); height: clamp(56px, 11vw, 76px); display: block; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7), 0 4px 12px rgba(0, 0, 0, 0.18);
}
.kop-tekst { display: grid; min-width: 0; }
.kop-h1 { font-size: clamp(1.5rem, 4.4vw, 2.3rem); font-weight: 900; line-height: 1.15; }
.kop-sub { font-weight: 800; opacity: 0.92; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profielknop {
  flex: none; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 6px;
  border-radius: 999px; border: 2px solid var(--oranje); background: rgba(20,48,87,0.45);
  color: var(--op-kleur); font: 800 1rem var(--font); cursor: pointer; max-width: 46vw;
  box-shadow: 0 4px 0 var(--oranje-donker); transition: transform .12s, box-shadow .12s, background .12s;
}
.profielknop:hover { background: rgba(20,48,87,0.6); }
.profielknop:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--oranje-donker); }
.profielknop:focus-visible { outline: 3px solid var(--op-kleur); outline-offset: 3px; }
.profiel-avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--oranje); display: grid; place-items: center; }
.profiel-avatar svg { width: 22px; height: 22px; display: block; }
.profielknop .profiel-naam { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Ronde kopknoppen voor geluid en donkere modus (zelfde als 24-Game) */
.kop-knop { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); background: rgba(20,48,87,0.35); color: var(--op-kleur); display: grid; place-items: center; cursor: pointer; padding: 0; }
.kop-knop:hover { background: rgba(20,48,87,0.55); }
.kop-knop:focus-visible { outline: 3px solid var(--op-kleur); outline-offset: 3px; }
.kop-knop svg { width: 24px; height: 24px; display: block; }
.icoon-badge { flex: none; width: 68px; height: 68px; display: grid; place-items: center; }
/* Transparant icoon direct op het verloop; een dunne lichte rand houdt de donkere delen zichtbaar */
.icoon-badge img {
  width: 62px; height: auto; display: block;
  filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
}
/* Tussen telefoon en laptop past de ondertitel niet naast de knoppen */
@media (max-width: 700px) { .kop-sub { display: none; } }
@media (max-width: 560px) {
  .kop-binnen { gap: 10px; padding-block: 14px; }
  .kop-titel { gap: 10px; }
  .kop-sub { display: none; }
  .pi-teken { width: 58px; height: 58px; }
  .icoon-badge { width: 48px; height: 48px; }
  .icoon-badge img { width: 46px; }
  .kop-knop { width: 40px; height: 40px; }
  .kop-knop svg { width: 22px; height: 22px; }
  .profielknop { min-height: 44px; padding: 0 5px; flex: none; }
  .profielknop .profiel-naam { display: none; }
  .kop-titel { flex: 1 0 auto; }
  .kop-h1 { white-space: nowrap; }
}
@media (max-width: 400px) {
  .kop-binnen { gap: 8px; }
  .kop-titel { gap: 8px; }
  .kop-h1 { font-size: 1.3rem; }
  .pi-teken { width: 52px; height: 52px; }
  .icoon-badge { width: 42px; height: 42px; }
  .icoon-badge img { width: 40px; }
  .profiel-avatar { width: 30px; height: 30px; }
  .profiel-avatar svg { width: 19px; height: 19px; }
  .kop-binnen { gap: 6px; }
  .kop-titel { gap: 6px; }
  .kop-h1 { font-size: 1.15rem; }
  .pi-teken { width: 46px; height: 46px; }
  .kop-knop { width: 34px; height: 34px; }
  .kop-knop svg { width: 19px; height: 19px; }
  .profielknop { min-height: 40px; }
  .icoon-badge { width: 36px; height: 36px; }
  .icoon-badge img { width: 35px; }
}
@media (max-width: 340px) {
  .kop-binnen { gap: 5px; padding-inline: 12px; }
  .kop-h1 { font-size: 1.05rem; }
  .pi-teken { width: 40px; height: 40px; }
  .kop-knop { width: 32px; height: 32px; }
  .kop-knop svg { width: 18px; height: 18px; }
  .profielknop { min-height: 36px; padding: 0 3px; }
  .profiel-avatar { width: 28px; height: 28px; }
  .icoon-badge { width: 32px; height: 32px; }
  .icoon-badge img { width: 31px; }
}

/* ---------- Pagina ---------- */
.pagina { max-width: 1100px; margin-inline: auto; padding-inline: 16px; padding-block: 22px 36px; display: grid; gap: 22px; }
.kaartje { background: var(--wit); border-radius: var(--radius); box-shadow: var(--schaduw-zacht); padding: 24px; min-width: 0; }
.kaartje h2 { font-size: 1.55rem; }
.kaartje > * + * { margin-top: 14px; }
.zacht { color: var(--tekst-zacht); }
.label { display: block; font-weight: 900; font-size: 1rem; color: var(--tekst-zacht); }
.rij { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.terug {
  justify-self: start; background: none; border: 0; color: var(--link); font: 800 1.05rem var(--font);
  cursor: pointer; min-height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 6px;
}
.paginatitel { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.paginatitel h2 { font-size: clamp(1.5rem, 4vw, 2rem); }

/* ---------- Knoppen ---------- */
.knop {
  min-height: 52px; padding: 0 24px; border: 0; border-radius: 16px; cursor: pointer;
  font: 800 1.08rem var(--font); color: var(--op-kleur); background: var(--blauw);
  box-shadow: 0 5px 0 var(--blauw-donker); transition: transform 0.1s, box-shadow 0.1s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.knop:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blauw-donker); }
a.knop { text-decoration: none; }
.lijst-plaatje { display: block; width: 100%; max-width: 820px; margin-inline: auto; border-radius: 16px; overflow: hidden; box-shadow: var(--schaduw-zacht); background: #ffffff; }
.lijst-plaatje img { display: block; width: 100%; height: auto; }
.knop.oranje { background: var(--oranje); color: var(--navy); box-shadow: 0 5px 0 var(--oranje-donker); }
.knop.oranje:active { box-shadow: 0 1px 0 var(--oranje-donker); }
.knop.licht { background: var(--cyaan-licht); color: var(--tekst); box-shadow: 0 5px 0 var(--rand-licht); }
.knop.licht:active { box-shadow: 0 1px 0 var(--rand-licht); }
.knop.rood { background: var(--rood); color: var(--op-kleur); box-shadow: 0 5px 0 var(--navy); }
.knop.groot { font-size: 1.25rem; min-height: 62px; padding: 0 30px; }
.knop.breed { width: 100%; }
.knop[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Keuzekaarten ---------- */
.keuzes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.keuze {
  position: relative; text-align: left; cursor: pointer; background: var(--wit); color: var(--tekst);
  font: 800 1rem var(--font); border: 4px solid var(--rand-licht); border-radius: var(--radius);
  box-shadow: 0 5px 0 var(--rand-licht); padding: 14px 34px 14px 14px; display: flex; gap: 12px; align-items: center;
  min-height: 52px; transition: transform 0.15s;
}
.keuze:hover { transform: scale(1.03); }
.keuze .em { font-size: 1.9rem; line-height: 1; flex: none; }
.keuze .naam { display: block; font-weight: 900; font-size: 1.15rem; }
.keuze .uitleg { display: block; font-weight: 700; color: var(--tekst-zacht); font-size: 0.95rem; }
.keuze .vink { display: none; position: absolute; top: 6px; right: 12px; color: var(--link); font-weight: 900; font-size: 1.2rem; }
.keuze[aria-pressed="true"] { border-color: var(--blauw); background: var(--cyaan-licht); box-shadow: 0 5px 0 var(--blauw); }
.keuze[aria-pressed="true"] .vink { display: block; }
.keuze svg { flex: none; }

/* ---------- Start: voortgang ---------- */
.start-rooster { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
.voortgang { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.ring { width: 190px; height: 190px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-midden { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-getal { font-size: 3.2rem; font-weight: 900; line-height: 1; color: var(--tekst); }
.ring-tekst { font-weight: 800; color: var(--tekst-zacht); font-size: 0.95rem; }
.ring-spoor { stroke: var(--cyaan-licht); }
.ring-vulling { stroke: url(#ringverloop); transition: stroke-dashoffset 0.8s ease; }
.groot-zin { font-size: clamp(1.35rem, 3.4vw, 1.75rem); font-weight: 900; line-height: 1.2; }
.balk { height: 16px; border-radius: 99px; background: var(--cyaan-licht); overflow: hidden; }
.balk > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blauw), var(--cyaan)); min-width: 6px; }
.balk-info { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; color: var(--tekst-zacht); font-size: 0.92rem; flex-wrap: wrap; }
.mini-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.record-regel { display: flex; flex-wrap: wrap; gap: 8px; }
.pil {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px;
  background: var(--cyaan-licht); color: var(--tekst); font-weight: 800; font-size: 0.92rem;
}
.pil.goud { background: var(--goud-licht); color: var(--badge-tekst); }
.pil.zilver { background: var(--zilver-licht); color: var(--badge-tekst); }

.volgende { display: flex; flex-direction: column; gap: 14px; }
.volgende > * { margin: 0 !important; }
.lint {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1.5rem; font-weight: 900;
  font-variant-numeric: tabular-nums; padding: 12px 14px; border-radius: 16px; background: var(--cyaan-licht);
}
.lint .vaag { color: var(--tekst-zacht); }
.lint .vraag {
  display: inline-grid; place-items: center; width: 1.25em; height: 1.45em; border-radius: 8px;
  background: var(--wit); border: 3px dashed var(--blauw); color: var(--blauw); font-size: 0.9em;
}

.tegels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tegel {
  text-align: left; cursor: pointer; background: var(--wit); color: var(--tekst); border: 4px solid var(--rand-licht);
  border-radius: var(--radius); box-shadow: 0 5px 0 var(--rand-licht); padding: 16px; display: grid; gap: 4px;
  align-content: start; transition: transform 0.15s; font-family: var(--font); min-width: 0;
}
.tegel:hover { transform: scale(1.03); }
.tegel[disabled] { opacity: 0.55; cursor: not-allowed; }
/* Persoonlijk doel */
.doel-regel { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 14px; border-radius: 14px; background: var(--cyaan-licht); font-weight: 700; }
.doel-regel.gehaald { background: var(--geel-licht); }
.doel-regel.gehaald.zilver { background: var(--zilver-vlak); }
.linkknop { background: none; border: 0; padding: 0 2px; min-height: 40px; color: var(--link); font: 800 0.98rem var(--font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.knop.klein { min-height: 44px; padding: 0 16px; font-size: 1rem; box-shadow: 0 4px 0 var(--blauw-donker); }
.balk.goud > span { background: linear-gradient(90deg, var(--goud), var(--goud-licht)); }
.balk.zilver > span { background: linear-gradient(90deg, var(--zilver-donker), var(--zilver)); }
.ring-doel { font-weight: 800; font-size: 0.82rem; color: var(--tekst-zacht); margin-top: 2px; }
.held { padding: 10px 14px; border-radius: 14px; background: var(--geel-licht); font-weight: 800; }
.volgende-held { font-size: 0.92rem; }
.helden-blok { display: grid; gap: 8px; padding-top: 4px; }
.helden-blok > * { margin: 0; }
.doel-keuzes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 600px; width: 100%; }
.doel-keuze {
  display: grid; gap: 0; text-align: left; padding: 8px 12px; border-radius: 14px; cursor: pointer;
  border: 3px solid var(--rand-licht); background: var(--wit); color: var(--tekst); font-family: var(--font);
  box-shadow: 0 4px 0 var(--rand-licht); transition: transform 0.15s;
}
.doel-keuze:hover { transform: scale(1.03); }
.doel-keuze b { font-size: 1.45rem; font-weight: 900; line-height: 1.2; }
.doel-keuze span { font-size: 0.82rem; font-weight: 700; color: var(--tekst-zacht); line-height: 1.25; }
.doel-keuze[aria-pressed="true"] { border-color: var(--blauw); background: var(--cyaan-licht); box-shadow: 0 4px 0 var(--blauw); }
.eigen-doel .veld { max-width: 220px; }
.doel-vlag { font-size: 5rem; line-height: 1; }
/* π-ladder */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ladder li { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--cyaan-licht); }
.ladder li .em { font-size: 1.6rem; line-height: 1; text-align: center; }
.ladder li b { display: block; }
.ladder li .zacht { font-size: 0.9rem; }
.ladder li.ok { background: var(--geel-licht); }
.ladder-status { font-weight: 900; font-size: 0.92rem; color: var(--tekst-zacht); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ladder li.ok .ladder-status { color: var(--groen-donker); }
.tegel[disabled]:hover { transform: none; }
.tegel .em { font-size: 2rem; line-height: 1.1; }
.tegel .naam { font-weight: 900; font-size: 1.12rem; line-height: 1.2; }
.tegel .uitleg { font-weight: 700; color: var(--tekst-zacht); font-size: 0.92rem; }

/* ---------- Stappen ---------- */
.stappen { display: flex; gap: 8px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.stappen li {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 99px;
  background: var(--cyaan-licht); font-weight: 800; color: var(--tekst-zacht);
}
.stappen li b {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--wit); color: var(--tekst-zacht); border: 2px solid var(--rand-licht);
}
.stappen li.nu { background: var(--blauw); color: var(--op-kleur); }
.stappen li.nu b { background: var(--op-kleur); color: var(--blauw); border-color: var(--op-kleur); }
.stappen li.klaar b { background: var(--groen); color: var(--op-kleur); border-color: var(--groen); }

/* ---------- Studeren ---------- */
.studeer-rooster { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.cijfertegels { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.ctegel {
  width: 66px; display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--tekst); font-family: var(--font);
}
.ctegel .vlak {
  width: 66px; height: 84px; border-radius: 16px; display: grid; place-items: center; font-size: 2.9rem; font-weight: 900;
  background: var(--wit); border: 4px solid var(--blauw); box-shadow: 0 5px 0 var(--blauw-donker);
  font-variant-numeric: tabular-nums; transition: transform 0.2s;
}
.ctegel[aria-pressed="true"] .vlak { background: var(--blauw); color: var(--op-kleur); }
.ctegel .nr { font-size: 0.8rem; font-weight: 800; color: var(--tekst-zacht); font-variant-numeric: tabular-nums; }
.ctegel:active .vlak { transform: translateY(3px); }
.voorloper { font-size: 1.6rem; font-weight: 900; color: var(--tekst-zacht); font-variant-numeric: tabular-nums; padding-bottom: 30px; }
@media (max-width: 480px) { .ctegel, .ctegel .vlak { width: 52px; } .ctegel .vlak { height: 68px; font-size: 2.3rem; } .cijfertegels { gap: 7px; } }
.hele-reeks { font-size: 1.15rem; font-weight: 800; line-height: 1.9; font-variant-numeric: tabular-nums; word-break: break-word; }
.hele-reeks .blk { margin-right: 0.45em; white-space: nowrap; }
.hele-reeks .nieuw { background: var(--geel-licht); border-radius: 6px; padding: 1px 3px; outline: 2px solid var(--geel); }
details.uitklap { border-radius: 16px; background: var(--cyaan-licht); padding: 12px 16px; }
details.uitklap summary { cursor: pointer; font-weight: 900; }
details.uitklap[open] summary { margin-bottom: 10px; }
.tip { padding: 14px 16px; border-radius: 16px; background: var(--geel-licht); font-weight: 700; }

/* ---------- Toets ---------- */
.toets-kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.toets-kop h2 { font-size: clamp(1.3rem, 3.6vw, 1.7rem); }
.levens { display: flex; gap: 6px; align-items: center; }
.hart { width: 34px; height: 32px; transition: transform 0.3s; }
.hart path { fill: var(--rood); }
.hart.weg path { fill: var(--rand-licht); }
.hart.weg { transform: scale(0.8); }
.hart.knal { animation: knal 0.5s; }
@keyframes knal { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(0.8); } }
.modus-chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; }
.teller { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--tekst-zacht); }

.reeks-wrap { max-height: 42vh; overflow-y: auto; border-radius: 18px; background: var(--cyaan-licht); padding: 14px; overscroll-behavior: contain; }
.reeks { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-end; }
.cue { font-size: 1.5rem; font-weight: 900; color: var(--tekst-zacht); font-variant-numeric: tabular-nums; padding-bottom: 4px; }
.blok { display: grid; gap: 2px; }
.blok-nr { font-size: 0.72rem; font-weight: 800; color: var(--tekst-zacht); font-variant-numeric: tabular-nums; padding-left: 2px; }
.blok-cijfers { display: flex; gap: 4px; }
.slot {
  width: 34px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 1.5rem; font-weight: 900;
  background: var(--wit); border: 3px solid var(--rand-licht); color: var(--tekst); font-variant-numeric: tabular-nums;
  position: relative;
}
.slot.nu { border-color: var(--oranje); box-shadow: 0 0 0 3px var(--geel-licht); animation: knipper 1.2s infinite; }
@keyframes knipper { 50% { border-color: var(--geel); } }
.slot.ok { border-color: var(--blauw); color: var(--blauw); }
.slot.hersteld { border-color: var(--goud); background: var(--geel-licht); }
.slot.overtypen { border-color: var(--goud); background: var(--geel-licht); color: var(--goud-donker); border-style: dashed; }
.slot.fout { border-color: var(--rood); background: var(--rood-licht); color: var(--rood); }
/* ---- Diploma: A4 liggend, altijd lichte kleuren (ook in het donkere thema en op papier) ---- */
.diploma-knoppen { justify-content: flex-start; }
.diploma-vel { container-type: inline-size; width: 100%; max-width: 1000px; }
.diploma { --d-tekst: #142a47; --d-zacht: #4a6178; aspect-ratio: 297 / 210; background: #ffffff; color: var(--d-tekst); border-radius: 14px; box-shadow: var(--schaduw-zacht); padding: 2.2cqw; overflow: hidden; }
.dip-rand { position: relative; height: 100%; border: 0.55cqw solid var(--navy); outline: 0.25cqw solid var(--cyaan); outline-offset: -1.3cqw; border-radius: 1.2cqw;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0.9cqw; padding: 3cqw 5cqw 4.5cqw;
  background: radial-gradient(circle at 50% 0%, rgba(76, 184, 222, 0.14), transparent 60%), #ffffff; }
.dip-watermerk { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-8deg); z-index: 0; pointer-events: none;
  font: 700 62cqw/1 var(--font-pi); color: rgba(201, 162, 39, 0.12); }
.diploma.zilver .dip-watermerk { color: rgba(111, 124, 137, 0.08); }
.dip-rand > :not(.dip-watermerk) { z-index: 1; }
.dip-titel, .dip-klein, .dip-naam, .dip-prestatie { position: relative; }
.dip-kop { position: absolute; top: 3.2cqw; left: 4cqw; display: flex; align-items: center; gap: 1cqw; font: 900 1.9cqw var(--font); color: var(--navy); }
.dip-pi { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; display: block; }
.dip-titel { font: 900 8.4cqw/1.05 var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--navy); margin-top: 1cqw; }
.dip-klein { font: 800 1.9cqw var(--font); color: var(--d-zacht); margin: 0; }
.dip-naam { font: 900 5.6cqw/1.1 var(--font); color: var(--d-tekst); margin: 0.2cqw 0 0.4cqw; padding: 0 3cqw 0.6cqw; border-bottom: 0.3cqw solid var(--oranje); max-width: 90%; overflow-wrap: anywhere; }
.dip-prestatie { display: flex; align-items: center; gap: 2cqw; margin-top: 0.6cqw; text-align: left; }
.dip-prestatie svg { width: 10cqw; height: auto; flex: none; }
.dip-prestatie > div > b { display: block; font: 900 3.6cqw/1.15 var(--font); color: var(--navy); }
.dip-prestatie > div > span { display: block; font: 800 1.9cqw var(--font); color: var(--d-zacht); margin-top: 0.4cqw; }
.dip-onder { position: absolute; left: 5cqw; right: 4.5cqw; bottom: 4cqw; display: flex; justify-content: space-between; align-items: flex-end; }
.dip-datum { display: grid; text-align: left; gap: 0.2cqw; }
.dip-datum span { font: 800 1.4cqw var(--font); color: var(--d-zacht); text-transform: uppercase; letter-spacing: 0.1em; }
.dip-datum b { font: 900 2.1cqw var(--font); color: var(--d-tekst); border-top: 0.2cqw solid var(--rand-licht); padding-top: 0.5cqw; min-width: 22cqw; }
.dip-stempel { width: 14cqw; height: 14cqw; transform: rotate(-10deg); }
.dip-stempel circle { stroke: var(--blauw); }
.dip-stempel .stempel-tekst { font: 900 17px var(--font); fill: var(--blauw); }
.dip-cijfers { position: absolute; left: 0; right: 0; bottom: 0.9cqw; margin: 0; font: 800 1.1cqw var(--font); color: rgba(43, 108, 158, 0.35); letter-spacing: 0.12em; white-space: nowrap; overflow: hidden; text-align: center; }
@media print {
  @page { size: A4 landscape; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body.op-diploma { background: #ffffff !important; margin: 0 !important; padding: 0 !important; height: 210mm; overflow: hidden; }
  body.op-diploma .kop, body.op-diploma .voet, body.op-diploma .achtergrond-pi, body.op-diploma .terug,
  body.op-diploma .diploma-knoppen, body.op-diploma #splash, body.op-diploma #modal-plek, body.op-diploma #confetti { display: none !important; }
  body.op-diploma .pagina { padding: 0; margin: 0; max-width: none; display: block; }
  body.op-diploma .diploma-vel { width: 297mm; max-width: none; }
  body.op-diploma .diploma { width: 297mm; height: 209.5mm; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
}
.slot.flits { border-color: var(--cyaan); background: var(--wit); color: var(--tekst); box-shadow: 0 0 0 3px var(--cyaan-licht), 0 0 12px rgba(76, 184, 222, 0.55); animation: flits-in 0.25s ease-out; }
@keyframes flits-in { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
#paneel.wacht .toetsenbord { opacity: 0.45; pointer-events: none; }
.slot.schud { animation: schud 0.35s; }
@keyframes schud { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (max-width: 480px) { .slot { width: 28px; height: 38px; font-size: 1.25rem; } .reeks { gap: 12px 10px; } .blok-cijfers { gap: 3px; } }

/* Vaste hoogte, zodat het toetsenbord niet verspringt als de tekst langer of korter wordt */
.melding { min-height: calc(2 * 1.5em + 24px); padding: 12px 16px; border-radius: 16px; font-weight: 800; font-size: 1.08rem; background: var(--accent-licht); display: flex; align-items: center; }
@media (max-width: 560px) { .melding { min-height: calc(3 * 1.5em + 24px); font-size: 1rem; } }
/* In de uitdaging groeit de reeks: een vaste hoogte houdt het toetsenbord op zijn plek */
.reeks-wrap.vast { height: 11rem; max-height: none; }
@media (max-width: 480px) { .reeks-wrap.vast { height: 9.5rem; } }
.melding.fout { background: var(--rood-licht); }
.melding.hint { background: var(--geel-licht); }
.melding.goed { background: var(--groen-licht); }

.toets-onder { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 22px; align-items: start; }
.toetsenbord { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.toets {
  min-height: 64px; border-radius: 16px; border: 0; cursor: pointer; font: 900 1.8rem var(--font);
  background: var(--wit); color: var(--tekst); box-shadow: 0 5px 0 var(--rand-licht); border: 3px solid var(--rand-licht);
  font-variant-numeric: tabular-nums; touch-action: manipulation;
}
.toets:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--rand-licht); }
.toets.mic { background: var(--blauw); color: var(--op-kleur); border-color: var(--blauw); box-shadow: 0 5px 0 var(--blauw-donker); font-size: 1.5rem; }
.toets.mic.aan { background: var(--rood); border-color: var(--rood); }
.toets.leeg { visibility: hidden; }
.spraak { display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: var(--accent-licht); }
/* Spelscherm (toets): compactere kop volgens de huisstijl, zodat er meer ruimte is voor het spel */
body.in-toets .pi-teken { width: 52px; height: 52px; }
body.in-toets .kop-h1 { font-size: 1.5rem; }
body.in-toets .kop-sub { display: none; }
@media (max-width: 400px) { body.in-toets .kop-h1 { font-size: 1.3rem; } }
/* Compacte toetsweergave op telefoons: het hele toetsenbord moet in beeld passen, ook op een klein scherm */
@media (max-width: 560px) {
  body.in-toets .kop-binnen { padding-block: 8px; }
  body.in-toets .pi-teken { width: 48px; height: 48px; }
  body.in-toets .icoon-badge { width: 34px; height: 34px; }
  body.in-toets .icoon-badge img { width: 32px; }
  body.in-toets .profielknop { min-height: 36px; box-shadow: 0 3px 0 var(--oranje-donker); }
  body.in-toets .kop-knop { width: 36px; height: 36px; }
  body.in-toets .kop-knop svg { width: 20px; height: 20px; }
  body.in-toets .profiel-avatar { width: 26px; height: 26px; }
  body.in-toets .profiel-avatar svg { width: 17px; height: 17px; }
  body.in-toets .pagina { padding-block: 4px 24px; gap: 6px; }
  body.in-toets .terug { min-height: 34px; font-size: 0.98rem; }
  body.in-toets .kaartje { padding: 12px 14px 16px; }
  body.in-toets .kaartje > * + * { margin-top: 8px; }
  body.in-toets .toets-kop { gap: 4px 10px; align-items: center; }
  body.in-toets .toets-kop .label { font-size: 0.85rem; }
  body.in-toets .toets-kop h2 { display: none; }   /* het kopje boven de toets (label) is genoeg */
  body.in-toets .modus-chip { font-size: 0.9rem; gap: 4px; }
  body.in-toets .modus-chip svg { width: 26px; height: 26px; }
  body.in-toets .hart { width: 24px; height: 23px; }
  body.in-toets .teller { font-size: 0.9rem; }
  body.in-toets .reeks-wrap { padding: 8px 10px; }
  body.in-toets .reeks-wrap.vast { height: 7.2rem; }
  body.in-toets .cue { font-size: 1.2rem; }
  body.in-toets .slot { width: 26px; height: 36px; font-size: 1.15rem; border-width: 2.5px; border-radius: 8px; }
  body.in-toets .blok-cijfers { gap: 2px; }
  body.in-toets .reeks { gap: 8px 10px; }

/* ---------- Hulpjes ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const getal = n => Number(n).toLocaleString("nl-NL");
const cijfer = i => DECIMALEN[i - 1];               // decimaal i (1 = eerste na de komma)
const reeksTekst = (a, b) => DECIMALEN.slice(a - 1, b);
const minder = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Opslag (alleen op dit toestel) ---------- */
function laad() {
  try { const s = localStorage.getItem(OPSLAG); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
let store = laad();
if (!store || typeof store !== "object" || !store.profiles) {
  store = { v: 1, active: null, profiles: {}, settings: { theme: "system", sound: true, speech: false } };
}
store.settings = Object.assign({ theme: "system", sound: true, speech: false }, store.settings || {});
/* Oudere profielen krijgen een persoonlijk doel: de eerstvolgende mijlpaal, minstens 25 */
Object.values(store.profiles).forEach(p => {
  if (!(p.goal > 0)) { p.goal = Math.max(25, MIJLPALEN.find(m => m > p.mastered) || MAX); p.goalDone = p.mastered >= p.goal ? p.goal : 0; }
});
function bewaar() { try { localStorage.setItem(OPSLAG, JSON.stringify(store)); } catch (e) {} }

function nieuwProfiel(naam, grootte, doel) {
  const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  store.profiles[id] = { id, name: naam, size: grootte, mastered: 0, recM: 0, recS: 0, pending: null, mode: "student", seenCards: [], goal: doel || 25, goalDone: 0, created: Date.now() };
  store.active = id;
  bewaar();
  return store.profiles[id];
}
function prof() { return store.active && store.profiles[store.active] ? store.profiles[store.active] : null; }

/* ---------- Spelregels ---------- */
function groepje(p) {
  const size = p.size;
  const start = p.mastered + 1;
  const end = Math.min(MAX, (Math.floor(p.mastered / size) + 1) * size);
  return { start, end, nr: Math.floor(p.mastered / size) + 1, totaal: Math.ceil(MAX / size), klaar: p.mastered >= MAX };
}
function heleReeksBereik(end) { return { start: end <= 100 ? 1 : end - 99, end }; }
function niveau(p, m) { return p.recM >= m ? "goud" : p.recS >= m ? "zilver" : null; }
function badgeKaart(p) { const o = {}; MIJLPALEN.forEach(m => (o[m] = niveau(p, m))); return o; }
function besteRecord(p) { return Math.max(p.recM, p.recS); }
function volgendeMijlpaal(p) { return MIJLPALEN.find(m => m > p.mastered) || null; }
function kaartOpen(p, k) { return k.open <= besteRecord(p); }

/* ---------- Persoonlijk doel ---------- */
const DOEL_OPTIES = [[10, "Een mooi begin"], [15, "Zoveel als NASA"], [25, "Een stevig doel"], [35, "Net als Ludolph"], [50, "Voor doorzetters"], [100, "Echte π-kenner"], [250, "Kampioen"], [500, "Supergeheugen"], [1000, "Alles uit deze app"]];
function doelKeuzeHTML(huidig, min) {
  const opties = DOEL_OPTIES.filter(([n]) => n > min);
  const voorbeeld = Math.min(MAX, Math.max(min + 5, 20));
  return `<div class="doel-keuzes" role="group" aria-label="Kies je doel">${opties.map(([n, tip]) => `<button type="button" class="doel-keuze" data-act="doelsel" data-n="${n}" aria-pressed="${n === huidig}"><b class="cijfers">${n}</b><span>${tip}</span></button>`).join("")}</div>
    <div class="eigen-doel"><label class="label" for="eigendoel">Of kies zelf een getal</label><input class="veld cijfers" id="eigendoel" type="number" inputmode="numeric" min="${min + 1}" max="${MAX}" placeholder="bijv. ${voorbeeld}" autocomplete="off"></div>
    <p class="foutje" id="doel-fout" hidden></p>`;
}
function leesDoel(min) {
  const eigen = ($("#eigendoel")?.value || "").trim();
  const fout = $("#doel-fout");
  const meldFout = t => { if (fout) { fout.hidden = false; fout.textContent = t; } return null; };
  if (eigen) {
    const n = Math.round(Number(eigen));
    if (!Number.isFinite(n) || n <= min || n > MAX) return meldFout(`Kies een getal van ${min + 1} tot en met ${MAX}.`);
    return n;
  }
  const sel = document.querySelector('[data-act="doelsel"][aria-pressed="true"]');
  return sel ? +sel.dataset.n : meldFout("Kies eerst een doel.");
}
function toonDoelKiezer() {
  const p = prof();
  if (!p || p.mastered >= MAX) return;
  const eerste = (DOEL_OPTIES.find(([n]) => n > p.mastered) || [MAX])[0];
  const huidig = p.goal > p.mastered ? p.goal : eerste;
  toonModal(`<h2 id="mtitel">🎯 Kies je doel</h2>
    <p>Hoeveel decimalen wil jij kennen?${p.mastered ? ` Je kent er nu ${getal(p.mastered)}.` : ""} Je kunt je doel altijd weer aanpassen.</p>
    <div style="width:100%;display:grid;gap:12px;text-align:left">${doelKeuzeHTML(huidig, p.mastered)}</div>
    <div class="knoppen"><button class="knop oranje groot" data-act="doelopslaan" data-focus>Dit is mijn doel!</button><button class="knop licht" data-act="sluitmodal">Annuleren</button></div>`);
}

function heldenHTML(lijst, m) {
  if (!lijst || !lijst.length) return "";
  const h = lijst[lijst.length - 1];
  return `<p class="held">${h.em} ${heldZin(h, m)}${lijst.length > 1 ? ` <span style="font-weight:700">Je versloeg in één keer ${lijst.length} π-helden!</span>` : ""}</p>`;
}
function heldZin(h, m) { return m === h.n && h.net ? h.net : h.meer; }
function laatsteHeld(p) { return HELDEN.filter(h => p.mastered >= h.need).pop() || null; }
function volgendeHeld(p) { return HELDEN.find(h => p.mastered < h.need) || null; }

   zilver (π Student) = enkele gladde rand + drie hartjes. Tekst op het lint.
   =================================================================== */
const SCHILD = "M60 4 L110 20 V62 C110 98 88 122 60 136 C32 122 10 98 10 62 V20 Z";
const SCHILD_BINNEN = "M60 15 L100 28 V62 C100 92 82 113 60 125 C38 113 20 92 20 62 V28 Z";
const SCHILD_MIDDEN = "M60 10 L105 24.5 V62 C105 95 85 117.5 60 130.5 C35 117.5 15 95 15 62 V24.5 Z"; // dun lijntje in de gouden rand
let gradTeller = 0;
function schild(m, lvl, px = 96) {
  const label = lvl === "goud" ? `Gouden badge ${m} decimalen, π Master` : lvl === "zilver" ? `Zilveren badge ${m} decimalen, π Student` : `Badge ${m} decimalen, nog niet verdiend`;
  if (!lvl) {
    return `<svg width="${px}" height="${Math.round(px * 140 / 148)}" viewBox="-14 0 148 140" role="img" aria-label="${label}">
      <path d="${SCHILD}" style="fill:var(--wit);stroke:var(--rand-licht)" stroke-width="5" stroke-dasharray="9 7"/>
      <text x="60" y="62" text-anchor="middle" style="fill:var(--rand-licht);font:700 44px var(--font-pi)">π</text>
      <text x="60" y="92" text-anchor="middle" style="fill:var(--tekst-zacht);font:900 ${m >= 1000 ? 24 : 29}px var(--font)">${m}</text>
      <g transform="translate(51 98)" style="fill:var(--tekst-zacht)"><rect x="1" y="7" width="16" height="12" rx="3"/><path d="M4 8 V5 a5 5 0 0 1 10 0 V8" fill="none" style="stroke:var(--tekst-zacht)" stroke-width="2.6"/></g>
    </svg>`;
  }
  const g = "sg" + (++gradTeller);
  const goud = lvl === "goud";
  const licht = goud ? "var(--goud-licht)" : "var(--zilver-licht)";
  const mid = goud ? "var(--goud)" : "var(--zilver)";
  const donker = goud ? "var(--goud-donker)" : "var(--zilver-donker)";
  const krans = m >= 1000 ? kransSVG(donker, licht) : "";
  const piY = 67, nY = 94;
  const symbool = goud
    ? `<path d="M47 34 L49.5 22 L55 28 L60 18 L65 28 L70.5 22 L73 34 Z" style="fill:${licht};stroke:${donker}" stroke-width="2.4" stroke-linejoin="round"/>`
    : [45, 60, 75].map(x => `<path transform="translate(${x - 6} 23) scale(1.2)" d="M5 9 C1 6 0 4 0 2.6 C0 0.8 1.4 0 2.6 0 C3.7 0 4.5 0.7 5 1.6 C5.5 0.7 6.3 0 7.4 0 C8.6 0 10 0.8 10 2.6 C10 4 9 6 5 9 Z" style="fill:var(--rood)"/>`).join("");
  return `<svg width="${px}" height="${Math.round(px * 140 / 148)}" viewBox="-14 0 148 140" role="img" aria-label="${label}">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" style="stop-color:${licht}"/><stop offset="0.55" style="stop-color:${mid}"/><stop offset="1" style="stop-color:${donker}"/>
    </linearGradient></defs>
    ${krans}
    <path d="${SCHILD}" style="fill:${donker}"/>
    ${goud ? `<path d="${SCHILD_MIDDEN}" fill="none" style="stroke:${licht}" stroke-width="2.2"/>` : `<path d="${SCHILD}" fill="none" style="stroke:${licht}" stroke-width="3"/>`}
    <path d="${SCHILD_BINNEN}" style="fill:url(#${g})"/>
    ${symbool}
    <text x="60" y="${piY}" text-anchor="middle" style="fill:var(--badge-tekst);font:700 44px var(--font-pi)">π</text>
    <text x="60" y="${nY}" text-anchor="middle" style="fill:var(--badge-tekst);font:900 ${m >= 1000 ? 24 : 30}px var(--font)">${m}</text>
    <path d="M2 99 H118 L111 111 L118 123 H2 L9 111 Z" style="fill:var(--navy)"/>
    <text x="60" y="116.5" text-anchor="middle" style="fill:var(--op-kleur);font:900 14.5px var(--font);letter-spacing:0.6px">${goud ? "MASTER" : "STUDENT"}</text>
  </svg>`;
}
function kransSVG(donker, licht) {
  let s = "";
  for (let i = 0; i < 7; i++) {
    const y = 34 + i * 13, x = 2 + Math.sin(i / 6 * Math.PI) * -8;
    s += `<ellipse cx="${x}" cy="${y}" rx="4" ry="8" transform="rotate(${-25 + i * 6} ${x} ${y})" style="fill:${licht};stroke:${donker}" stroke-width="1.5"/>`;
    s += `<ellipse cx="${120 - x}" cy="${y}" rx="4" ry="8" transform="rotate(${25 - i * 6} ${120 - x} ${y})" style="fill:${licht};stroke:${donker}" stroke-width="1.5"/>`;
  }
  return s;
}

function terugKnop(naar = "home", tekst = "Terug") { return `<button class="terug" data-act="go" data-to="${naar}">← ${tekst}</button>`; }
function seqHTML(a, b, size, markeerVanaf = Infinity) {
  let s = "", blok = "";
  for (let i = a; i <= b; i++) {
    blok += cijfer(i);
    if (i % size === 0 || i === b) {
      const nieuw = i >= markeerVanaf;
      s += `<span class="blk${nieuw ? " nieuw" : ""}">${blok}</span>`;
      blok = "";
    }
  }
  return s;
}
function modusKeuze(p) {

}

      <p class="zacht">Je voortgang blijft alleen op dit apparaat. Er gaat niets naar internet.</p>
    </form>`;
  if (!lijst.length || state.nieuwForm) return form;
  return `<div class="paginatitel"><h2>Wie gaat er oefenen?</h2></div>
    <div class="profiel-lijst">
      ${lijst.map(p => `<button class="tegel" data-act="kiesprofiel" data-id="${p.id}">
        <span class="em">${p.id === store.active ? "⭐" : "👤"}</span>
        <span class="naam">${esc(p.name)}</span>
        <span class="uitleg">Kent ${getal(p.mastered)} decimalen · doel ${getal(p.goal)}</span>
        <span class="mini-badges">${MIJLPALEN.filter(m => niveau(p, m)).map(m => schild(m, niveau(p, m), 30)).join("")}</span>
      </button>`).join("")}
      <button class="tegel" data-act="nieuwform" data-show="1"><span class="em">➕</span><span class="naam">Nieuw profiel</span><span class="uitleg">Voor een ander kind op dit apparaat</span></button>
    </div>`;
}

/* ---- Start ---- */
function vHome(p) {
  const g = groepje(p);
  const vm = volgendeMijlpaal(p);
  const doel = p.goal;
  const gehaald = p.mastered >= doel;
  const metaal = p.recM >= doel ? "goud" : "zilver";   // doel gehaald als π Master = goud, anders zilver
  const frac = Math.min(1, p.mastered / doel);
  const pct = Math.min(100, Math.floor(frac * 100));
  const omtrek = 2 * Math.PI * 80;
  const best = besteRecord(p);
  const bk = badgeKaart(p);
  const aantalBadges = MIJLPALEN.filter(m => bk[m]).length;
  const openKaarten = KAARTEN.filter(k => kaartOpen(p, k)).length;
  const nieuweKaarten = KAARTEN.filter(k => kaartOpen(p, k) && !p.seenCards.includes(k.id)).length;
  const lintVoor = p.mastered > 0 ? reeksTekst(Math.max(1, p.mastered - 9), p.mastered) : "";
  const vraagjes = g.klaar ? "" : Array.from({ length: g.end - g.start + 1 }, () => `<span class="vraag">?</span>`).join("");
  const held = laatsteHeld(p), volgend = volgendeHeld(p);
  const zin = p.mastered === 0 ? `Hoi ${esc(p.name)}! Klaar voor je eerste groepje?`
    : g.klaar ? `Wauw ${esc(p.name)}, je kent alle 1000 decimalen!`
    : gehaald ? `Doel gehaald! Je kent ${getal(p.mastered)} decimalen van π.`
    : `Je kent ${getal(p.mastered)} decimalen van π!`;
  const doelDeel = g.klaar ? "" : gehaald
    ? `<div class="doel-regel gehaald ${metaal}"><span>🎯 Je doel was <b>${getal(doel)}</b>. Gelukt! Wil je nog verder?</span><span class="rij" style="gap:8px"><button class="knop klein" data-act="diploma">🎓 Diploma</button><button class="knop klein" data-act="kiesdoel">Kies een nieuw doel</button></span></div>`
    : `<div class="doel-regel"><span>🎯 Jouw doel: <b>${getal(doel)}</b> · nog <b>${getal(doel - p.mastered)}</b> te gaan</span><button class="linkknop" data-act="kiesdoel">Doel aanpassen</button></div>`;
  const pendingNu = p.pending === g.end;
  return `
  <section class="start-rooster">
    <div class="kaartje voortgang">
      <div class="ring">
        <svg viewBox="0 0 190 190" aria-hidden="true">
          <defs>
            <linearGradient id="ringverloop" x1="0" x2="1"><stop offset="0" style="stop-color:var(--blauw)"/><stop offset="1" style="stop-color:var(--cyaan)"/></linearGradient>
            <linearGradient id="ringgoud" x1="0" x2="1"><stop offset="0" style="stop-color:var(--goud)"/><stop offset="1" style="stop-color:var(--goud-licht)"/></linearGradient>
            <linearGradient id="ringzilver" x1="0" x2="1"><stop offset="0" style="stop-color:var(--zilver-donker)"/><stop offset="1" style="stop-color:var(--zilver)"/></linearGradient>
          </defs>
          <circle class="ring-spoor" cx="95" cy="95" r="80" fill="none" stroke-width="16"/>
          <circle class="ring-vulling" cx="95" cy="95" r="80" fill="none" stroke-width="16" stroke-linecap="round" style="stroke:url(#${gehaald ? "ring" + metaal : "ringverloop"})" stroke-dasharray="${omtrek}" stroke-dashoffset="${omtrek * (1 - Math.max(frac, 0.015))}"/>
        </svg>
        <div class="ring-midden"><span class="ring-getal cijfers">${getal(p.mastered)}</span><span class="ring-tekst">decimalen</span><span class="ring-doel">${gehaald ? "🎯 doel gehaald" : `🎯 doel: ${getal(doel)}`}</span></div>
      </div>
      <div style="display:grid;gap:12px;min-width:0">
        <p class="groot-zin">${zin}</p>
        ${doelDeel}
        <div class="balk${gehaald ? " " + metaal : ""}" role="progressbar" aria-label="Voortgang naar je doel" aria-valuemin="0" aria-valuemax="${doel}" aria-valuenow="${Math.min(p.mastered, doel)}"><span style="width:${pct}%"></span></div>
        <div class="balk-info"><span>${getal(Math.min(p.mastered, doel))} van ${getal(doel)}</span><span>${pct}%</span></div>
        <div class="record-regel">
          ${best ? `<span class="pil ${p.recM >= p.recS ? "goud" : "zilver"}">🏆 Record: ${getal(best)} · ${p.recM >= p.recS ? "π Master" : "π Student"}</span>` : `<span class="pil">🏆 Nog geen record</span>`}
          ${p.recM > 0 && p.recM < p.recS ? `<span class="pil goud">π Master: ${getal(p.recM)}</span>` : ""}
          ${vm ? `<span class="pil">🛡️ Volgende badge bij ${getal(vm)}</span>` : ""}
        </div>
      </div>
    </div>
    <div class="kaartje volgende">
      <span class="label">${g.klaar ? "Alles geleerd" : `Groepje ${g.nr}`}</span>
      ${g.klaar ? `<p>Probeer de hele-reeks-uitdaging als π Master om alle badges goud te maken.</p>` : `
      <div class="lint cijfers" aria-label="Je reeks tot nu toe, met het volgende groepje als vraagtekens"><span>3,</span>${p.mastered > 10 ? `<span class="vaag">…</span>` : ""}<span class="vaag">${lintVoor}</span>${vraagjes}</div>
      <p class="zacht">Decimaal ${g.start} t/m ${g.end}${pendingNu ? " · groepje al goed, nu nog de hele reeks" : ""}</p>`}
      <button class="knop oranje groot breed" data-act="${g.klaar ? "go" : "study"}" data-to="full">${g.klaar ? "Naar de uitdaging" : p.mastered === 0 && !pendingNu ? "Begin met groepje 1" : `Verder met groepje ${g.nr}`}</button>
      ${p.mastered === 0 ? `<p class="tip">Ken je al decimalen van π? Doe dan eerst de <button class="linkknop" data-act="go" data-to="full">hele-reeks-uitdaging</button> en spring meteen vooruit.</p>` : ""}
    </div>
  </section>
  <section class="tegels" aria-label="Menu">
    <button class="tegel" data-act="herhaal" ${p.mastered ? "" : "disabled"}><span class="em">🧠</span><span class="naam">Herhaal wat ik al ken</span><span class="uitleg">${p.mastered ? `Decimaal 1 t/m ${getal(p.mastered)} · zonder levens, telt niet mee` : "Leer eerst je eerste groepje"}</span></button>
    <button class="tegel" data-act="go" data-to="full"><span class="em">🏁</span><span class="naam">Hele-reeks-uitdaging</span><span class="uitleg">Hoe ver kom jij foutloos?</span></button>
    <button class="tegel" data-act="go" data-to="practice"><span class="em">🔁</span><span class="naam">Vrij oefenen</span><span class="uitleg">Kies zelf een stukje om te oefenen</span></button>
    <button class="tegel" data-act="go" data-to="badges"><span class="em">🛡️</span><span class="naam">Badges en π-ladder</span><span class="uitleg">${aantalBadges} ${aantalBadges === 1 ? "badge" : "badges"} · ${HELDEN.filter(h => p.mastered >= h.need).length} π-helden verslagen</span></button>
    <button class="tegel" data-act="go" data-to="cards"><span class="em">💡</span><span class="naam">Weetjes over π</span><span class="uitleg">${openKaarten} van ${KAARTEN.length} open${nieuweKaarten ? ` · <b style="color:var(--link)">${nieuweKaarten} nieuw!</b>` : ""}</span></button>
    <button class="tegel" data-act="go" data-to="lijst"><span class="em">📄</span><span class="naam">π-decimalenlijst</span><span class="uitleg">Alle 1000 decimalen bekijken of afdrukken</span></button>
  </section>
  <div class="rij" style="justify-content:flex-end"><button class="knop licht" data-act="go" data-to="settings">⚙️ Instellingen</button></div>`;
}

/* ---- Studeren ---- */
function vStudy(p) {
  const g = groepje(p);
  if (g.klaar) { state.view = "home"; return vHome(p); }
  const pendingNu = p.pending === g.end;
  const hr = heleReeksBereik(g.end);
  const voor = g.start > 1 ? reeksTekst(Math.max(1, g.start - 10), g.start - 1) : "";
  const alles = state.verstopt.size === g.end - g.start + 1;
  let tegels = "";
  for (let i = g.start; i <= g.end; i++) {
    const weg = state.verstopt.has(i);
    tegels += `<button class="ctegel" data-act="flip" data-i="${i}" aria-pressed="${weg}" aria-label="Decimaal ${i}${weg ? ", verstopt" : `: ${cijfer(i)}`}"><span class="vlak">${weg ? "?" : cijfer(i)}</span><span class="nr">${i}</span></button>`;
  }
  return `${terugKnop()}
  <div class="paginatitel"><h2>Groepje ${g.nr}: decimaal ${g.start} t/m ${g.end}</h2></div>
  <ol class="stappen" aria-label="Stappen">
    <li class="${pendingNu ? "klaar" : "nu"}"><b>${pendingNu ? "✓" : "1"}</b>Studeren</li>
    <li class="${pendingNu ? "klaar" : ""}"><b>${pendingNu ? "✓" : "2"}</b>Toets groepje</li>
    <li class="${pendingNu ? "nu" : ""}"><b>3</b>Hele reeks</li>
  </ol>
  <section class="studeer-rooster">
    <div class="kaartje">
      <h2>Je nieuwe cijfers</h2>
      <p class="zacht">Kijk zo lang als je wilt. Tik op een cijfer om het te verstoppen en test jezelf.</p>
      <div class="cijfertegels">${voor ? `<span class="voorloper">…${voor}</span>` : `<span class="voorloper">3,</span>`}${tegels}</div>
      <div class="rij"><button class="knop licht" data-act="flipall">${alles ? "👀 Laat alles zien" : "🙈 Verstop alles"}</button><button class="knop licht" data-act="flits">⚡ Flitsmodus</button></div>
      <p class="zacht">⚡ Flitsmodus: je ziet het groepje heel even, dan verdwijnt het en typ jij het na. Telt niet mee.</p>
      <details class="uitklap"${g.start <= 20 ? " open" : ""}><summary>Zo ziet je hele reeks eruit</summary>
        <div class="hele-reeks"><span class="blk">3,</span>${seqHTML(1, g.end, p.size, g.start)}</div>
      </details>
      <p class="tip">💡 Tip: zeg de cijfers zachtjes hardop, in een vast ritme. Zo onthoud je ze beter.</p>
      <p><button class="linkknop" data-act="go" data-to="lijst">📄 Bekijk of print de π-decimalenlijst</button></p>
    </div>
    <div class="kaartje">
      ${modusKeuze(p)}
      <p class="zacht">${pendingNu
        ? `Je groepje is al goed. Nu typ je de hele reeks: decimaal ${hr.start} t/m ${hr.end}.`
        : `Eerst typ je dit groepje uit je hoofd. Daarna de hele reeks: decimaal ${hr.start} t/m ${hr.end}.`}</p>
      <button class="knop oranje groot breed" data-act="${pendingNu ? "startcum" : "startgroup"}">${pendingNu ? "Toets de hele reeks" : "Ik ben er klaar voor!"}</button>
    </div>
  </section>`;
}

/* ---- Hele-reeks-uitdaging ---- */

  return `${terugKnop()}

      <p>Haal je een mijlpaal als <b>π Master</b>? Dan wordt je badge goud!</p>
      <div class="record-regel">

/* ---- Vrij oefenen ---- */
function vPractice(p) {
  const g = groepje(p);
  const tot = g.klaar ? MAX : g.end;   // het huidige groepje mag je ook bekijken
  const stukken = [];
  for (let s = 1; s <= tot; s += p.size) stukken.push({ a: s, b: Math.min(tot, s + p.size - 1) });
  if (!state.oefen || state.oefen.b > tot) state.oefen = stukken[stukken.length - 1];
  const sel = state.oefen;
  const isAlles = sel.alles;
  const chips = stukken.map(s => `<button class="chip${s.a > p.mastered ? " nieuw" : ""}" data-act="oefensel" data-a="${s.a}" data-b="${s.b}" aria-pressed="${!isAlles && sel.a === s.a}">${s.a}–${s.b}</button>`).join("");
  let tegels = "";
  if (!isAlles) for (let i = sel.a; i <= sel.b; i++) {
    const weg = state.verstopt.has(i);
    tegels += `<button class="ctegel" data-act="flip" data-i="${i}" aria-pressed="${weg}" aria-label="Decimaal ${i}"><span class="vlak">${weg ? "?" : cijfer(i)}</span><span class="nr">${i}</span></button>`;
  }
  return `${terugKnop()}
  <div class="paginatitel"><h2>🔁 Vrij oefenen</h2></div>
  <p class="zacht">Hier oefen je zonder levens en zonder dat het meetelt. Kies een stukje. Liever op papier? <button class="linkknop" data-act="go" data-to="lijst">📄 Bekijk of print de π-decimalenlijst</button></p>
  <section class="kaartje">
    <span class="label">Kies een stukje</span>
    <div class="chips">${chips}${p.mastered > 0 ? `<button class="chip" data-act="oefensel" data-a="1" data-b="${p.mastered}" data-alles="1" aria-pressed="${!!isAlles}">Alles (1–${p.mastered})</button>` : ""}</div>
  </section>
  <section class="kaartje">
    <h2>Decimaal ${sel.a} t/m ${sel.b}</h2>
    ${isAlles ? `<div class="hele-reeks"><span class="blk">3,</span>${seqHTML(1, sel.b, p.size)}</div>` : `
      <div class="cijfertegels">${sel.a > 1 ? `<span class="voorloper">…${reeksTekst(Math.max(1, sel.a - 5), sel.a - 1)}</span>` : `<span class="voorloper">3,</span>`}${tegels}</div>
      <div class="rij"><button class="knop licht" data-act="flipall" data-a="${sel.a}" data-b="${sel.b}">🙈 Verstop of laat zien</button></div>`}
    <button class="knop oranje groot" data-act="startpractice">Oefen dit stukje</button>
  </section>`;
}

/* ---- Weetjes ---- */
function vCards(p) {

function vCard(p) {
  const k = KAARTEN.find(x => x.id === state.cardId);
  if (!k || !kaartOpen(p, k)) { state.view = "cards"; return vCards(p); }
  if (!p.seenCards.includes(k.id)) { p.seenCards.push(k.id); bewaar(); }

/* Flitsmodus: het groepje is even te zien, verdwijnt en het kind typt het na (telt niet mee) */
function flitsTijd(n) { return n <= 5 ? 3 : 5; }   // seconden: 3 voor een groepje van 5, 5 voor een groepje van 10
function startFlits() {
  const p = prof(); const g = groepje(p);

}
function toetsTitel(t) {
  const p = prof();
  if (t.flits) return { label: "⚡ Flitsmodus", titel: `Onthoud decimaal ${t.start} t/m ${t.end}` };
  if (t.kind === "group") return { label: `Groepje ${groepje(p).nr} · stap 2`, titel: `Typ decimaal ${t.start} t/m ${t.end}` };

}
function hartenHTML(t) {
  let s = "";
  for (let i = 0; i < LEVENS; i++) s += `<svg class="hart${i >= t.lives ? " weg" : ""}" data-hart="${i}" viewBox="0 0 34 32" aria-hidden="true"><path d="M17 30 C6 22 1 16 1 9.5 C1 4.5 5 1 9.5 1 C12.8 1 15.5 3 17 5.6 C18.5 3 21.2 1 24.5 1 C29 1 33 4.5 33 9.5 C33 16 28 22 17 30 Z"/></svg>`;
  return `<div class="levens" aria-label="${t.lives} van de ${LEVENS} levens over">${s}</div>`;
}
function slotHTML(t, i) {
  const st = t.status[i];
  let cls = "slot", inh = "";
  if (st === "ok") { cls += " ok"; inh = cijfer(i); }
  else if (st === "hersteld") { cls += " hersteld"; inh = cijfer(i); }
  else if (st === "fout") { cls += " fout"; inh = t.wrong ? t.wrong.typed : ""; }
  else if (t.fase === "kijken") { cls += " flits"; inh = cijfer(i); }
  else if (i === t.pos && t.fase === "spelen") { cls += t.retype !== null ? " overtypen" : " nu"; inh = t.retype !== null ? t.retype : ""; }
  return `<span class="${cls}" data-slot="${i}">${inh}</span>`;
}
function zichtEinde(t, size) {
  // In de uitdaging laten we niet alle 1000 vakjes zien: alleen het huidige blok en het volgende
  if (t.kind !== "full") return t.end;
  return Math.min(t.end, Math.ceil(Math.max(t.pos, 1) / size) * size + size);
}
function reeksHTML(t) {
  const p = prof();
  const size = p ? p.size : 5;
  const eind = t.zicht = zichtEinde(t, size);
  const cue = t.start === 1 ? "3," : "…" + reeksTekst(Math.max(1, t.start - 5), t.start - 1);
  let s = `<span class="cue">${cue}</span>`;
  let i = t.start;
  while (i <= eind) {
    const blokEind = Math.min(eind, Math.ceil(i / size) * size);
    let slots = "";
    for (let j = i; j <= blokEind; j++) slots += slotHTML(t, j);
    s += `<span class="blok"><span class="blok-nr">${i}</span><span class="blok-cijfers">${slots}</span></span>`;
    i = blokEind + 1;
  }
  return s;
}
function vTest(p) {

  if (!t) { state.view = "home"; return vHome(p); }
  const k = toetsTitel(t);
  const modus = t.mode ? `<span class="modus-chip">${schild(10, t.mode === "master" ? "goud" : "zilver", 34).replace(">10<", "><")}${t.mode === "master" ? "π Master" : "π Student"}</span>` : "";

  <section class="kaartje">

}
function tekenToets() {
  const t = state.test;

  const totaal = t.end - t.start + 1;

  const m = $("#melding");

}
function startMelding(t) {

}
function toetsenbordHTML() {

  for (const d of ["1", "2", "3", "4", "5", "6", "7", "8", "9"]) s += `<button class="toets" data-act="cijfer" data-d="${d}">${d}</button>`;
  s += spraakAan ? `<button class="toets mic${state.spraak?.luistert ? " aan" : ""}" data-act="mic" aria-label="Cijfers inspreken">🎤</button>` : `<span class="toets leeg"></span>`;
  s += `<button class="toets" data-act="cijfer" data-d="0">0</button><span class="toets leeg"></span></div>`;
  const stop = state.test && state.test.kind === "full" ? `<div class="rij" style="margin-top:14px"><button class="knop licht" data-act="stopfull">🏁 Stop, verder weet ik het niet</button></div>` : "";
  s += `<div><div id="spraak-plek">${spraakHTML()}</div>${stop}</div></div>`;
  return s;
}
function updateSlot(i) {
  const el = document.querySelector(`[data-slot="${i}"]`);
  if (el) el.outerHTML = slotHTML(state.test, i);
}
function scrollNaarNu() {
  const t = state.test;
  const el = document.querySelector(`[data-slot="${t.fase === "spelen" ? t.pos : t.wrong ? t.wrong.pos : Math.min(t.end, t.pos)}"]`);
  const wrap = $("#reeks-wrap");
  if (el && wrap) {
    if (t.fase === "spelen" && t.pos === t.start) { wrap.scrollTop = 0; return; }   // begin: laat ook "3," zien
    const top = el.offsetTop - wrap.offsetTop;
    const onder = top + el.offsetHeight;
    if (top < wrap.scrollTop + 10 || onder > wrap.scrollTop + wrap.clientHeight - 6) wrap.scrollTop = Math.max(0, top - wrap.clientHeight / 2);
  }
}

function typCijfer(d) {
  const t = state.test;
  if (!t || t.fase !== "spelen") return;
  const i = t.pos;
  const goed = cijfer(i);
  // Gewoonte "3 komma...": een 3 als allereerste toets telt niet als fout
  if (i === 1 && t.start === 1 && d === "3" && t.retype === null) {
    t.melding = { soort: "hint", tekst: "Die 3 staat er al! Begin met het eerste cijfer na de komma." };
    tekenToetsLicht();
    return;
  }
  if (t.retype !== null) {
    if (d === goed) {
      t.status[i] = "hersteld"; t.retype = null; t.melding = { soort: "goed", tekst: "Goed overgetypt! Ga maar verder." };
      volgende();
    } else {
      const el = document.querySelector(`[data-slot="${i}"]`);
      if (el) { el.classList.remove("schud"); void el.offsetWidth; el.classList.add("schud"); }
      t.melding = { soort: "hint", tekst: `Typ de <b>${goed}</b> over om verder te gaan.` };
      tekenToets();
    }
    return;
  }
  if (d === goed) {
    t.status[i] = "ok";
    if (t.melding && t.melding.soort !== "hint") t.melding = null;
    const wachtrij = t.wachtrij;
    volgende();
    // Ontbrekend dubbel cijfer zelf getypt: ga verder met de rest van wat het kind zei
    if (wachtrij && state.test === t && t.fase === "spelen" && cijfer(t.pos) !== t.wachtCijfer) {
      t.wachtrij = null; t.melding = null;
      verwerkCijfers(wachtrij);
      if (state.test === t && t.fase === "spelen" && !t.melding) { t.melding = { soort: "goed", tekst: "Top! Daarna ging ik verder met wat je zei." }; tekenToets(); }
    }
    return;
  }
  // Fout
  t.wachtrij = null;
  t.errors++;
  if (!t.eersteFout) t.eersteFout = i;
  geluid("fout");
  if (t.kind === "practice") {
    t.retype = goed;
    t.melding = { soort: "hint", tekst: `Decimaal ${i} is een <b>${goed}</b>, niet een ${d}. Typ de ${goed} over.` };
    updateSlot(i); tekenToets(); return;
  }
  if (t.mode === "master") {
    t.status[i] = "fout"; t.wrong = { pos: i, typed: d, goed };
    eindig(false); return;
  }
  // π Student: leven kwijt
  t.lives--;
  const hart = document.querySelector(`[data-hart="${t.lives}"]`);
  if (hart) { hart.classList.add("weg", "knal"); }
  const lv = document.querySelector(".levens"); if (lv) lv.setAttribute("aria-label", `${t.lives} van de ${LEVENS} levens over`);
  if (t.lives <= 0) {
    t.status[i] = "fout"; t.wrong = { pos: i, typed: d, goed };
    eindig(false); return;
  }
  t.retype = goed;
  t.melding = { soort: "fout", tekst: `Oeps! Decimaal ${i} is een <b>${goed}</b>, geen ${d}. Je verliest een leven. Typ de ${goed} over.` };
  updateSlot(i); tekenToets();
}
function volgende() {
  const t = state.test;
  const vorige = t.pos;
  t.pos++;
  updateSlot(vorige);
  if (t.pos > t.end) { eindig(true); return; }
  if (t.kind === "full" && t.pos > t.zicht) { const r = $("#reeks"); if (r) r.innerHTML = reeksHTML(t); }
  else updateSlot(t.pos);

function tekenToetsLicht() {

function eindig(gelukt) {
  const t = state.test;
  const p = prof();
  t.fase = "klaar"; t.gelukt = gelukt; t.retype = null;
  stopSpraak();
  t.melding = gelukt && t.kind === "practice" && t.errors ? { soort: "goed", tekst: "🏁 Klaar!" } : gelukt ? { soort: "goed", tekst: "✅ Alles goed!" } : t.gestopt ? { soort: "goed", tekst: "🏁 Gestopt. Goed gedaan!" } : { soort: "fout", tekst: `Decimaal ${t.wrong.pos} was een ${t.wrong.goed}.` };
  let viering = null;
  if (t.kind === "group") {
    if (gelukt) { p.pending = t.end; bewaar(); geluid("groep"); confetti(60); }
  } else if (t.kind === "cum") {
    if (gelukt) {
      const voorM = p.mastered;
      viering = ontgrendel(p, t.end, t.mode);
      t.helden = HELDEN.filter(h => voorM < h.need && p.mastered >= h.need);
      if (p.mastered >= p.goal && (p.goalDone || 0) < p.goal) { p.goalDone = p.goal; p.goalDatum = Date.now(); bewaar(); viering.doel = p.goal; }
    }
  } else if (t.kind === "full") {
    // Record: zo ver kwam je (bij π Student mét levens). Instromen: alleen tot de eerste fout.
    const score = gelukt ? t.end : t.pos - 1;
    const instroomScore = t.eersteFout ? Math.min(score, t.eersteFout - 1) : score;
    t.score = score;
    const voorM = p.mastered;
    const voor = badgeKaart(p), voorCards = KAARTEN.filter(k => kaartOpen(p, k)).map(k => k.id);
    const oud = t.mode === "master" ? p.recM : p.recS;
    if (t.mode === "master") p.recM = Math.max(p.recM, score); else p.recS = Math.max(p.recS, score);
    t.nieuwRecord = score > oud && score > 0;
    t.instroom = 0;
    if (instroomScore > p.mastered) { p.mastered = instroomScore; p.pending = null; t.instroom = instroomScore - voorM; state.verstopt.clear(); }
    p.recS = Math.max(p.recS, p.mastered);
    bewaar();
    viering = verschil(p, voor, voorCards);
    t.helden = HELDEN.filter(h => voorM < h.need && p.mastered >= h.need);
    if (p.mastered >= p.goal && (p.goalDone || 0) < p.goal) { p.goalDone = p.goal; p.goalDatum = Date.now(); bewaar(); viering.doel = p.goal; }
    if (!viering.badges.length && !viering.kaarten.length && !viering.doel && (t.nieuwRecord || t.instroom)) { geluid("groep"); confetti(70); }
  }
  // volledige herteken van de reeks (fout cijfer zichtbaar)
  const r = $("#reeks"); if (r) r.innerHTML = reeksHTML(t);
  tekenToets();
  if (viering && (viering.badges.length || viering.kaarten.length || viering.doel)) setTimeout(() => vier(viering), 450);
  else if (t.kind === "cum" && gelukt) { geluid("groep"); confetti(90); }
  meld(gelukt ? "Gelukt!" : t.gestopt ? "Gestopt. Goed gedaan!" : "Helaas, dit keer niet.");
}

function tekenVeelhoek(el, n) {

function zoekInPi(q) {

}

/* ---------- Vegen of de terugknop van de telefoon = "Terug" in de app ----------

const terugAan = (() => { try { return window.top === window && !!history.pushState; } catch (e) { return false; } })();

  if (knoop.nodeType === 3) { if (knoop.nodeValue.includes("π")) lijst.push(knoop); }
  else {
    const w = document.createTreeWalker(basis, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes("π") && !n.parentElement.closest(PI_OVERSLAAN) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    while (w.nextNode()) lijst.push(w.currentNode);
  }
  for (const n of lijst) {
    const frag = document.createDocumentFragment();
    n.nodeValue.split("π").forEach((stuk, i) => {
      if (i) { const sp = document.createElement("span"); sp.className = "pi"; sp.textContent = "π"; frag.appendChild(sp); }
      if (stuk) frag.appendChild(document.createTextNode(stuk));
    });
    n.replaceWith(frag);
  }
}
new MutationObserver(lijst => { for (const m of lijst) m.addedNodes.forEach(piWrap); }).observe(document.body, { childList: true, subtree: true });

// Controle bij het laden: zijn de decimalen intact?
if (DECIMALEN.length !== MAX || !DECIMALEN.startsWith("14159265358979")) console.error("Decimalen van π beschadigd");
if (!prof()) state.view = "profiles";
render();
// Het app-icoon linksboven in de kop: dezelfde afbeelding als op het beginscherm, in hoge resolutie
try { const hoog = document.querySelector('link[rel="apple-touch-icon"]')?.href; if (hoog) document.querySelector(".kop .app-icoon").src = hoog; } catch (e) {}
piWrap(document.body);
// Offline werken: alleen in de online versie (niet in een voorbeeldvenster)
try {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
} catch (e) {}
// Openingsscherm: na 3 seconden (of bij een tik) zacht weg
(function () {
  const sp = document.getElementById("splash");
  if (!sp) return;
  let klaar = false;
  const weg = () => { if (klaar) return; klaar = true; sp.classList.add("weg"); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener("click", weg);
  setTimeout(weg, 3000);
})();
</script>

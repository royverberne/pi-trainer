  toonModal(`<h2 id="mtitel">${titel}</h2><p>${tekst}</p>
    <div class="knoppen"><button class="knop licht" data-act="sluitmodal" data-focus>Nee, terug</button><button class="knop rood" data-act="bevestig">${knopTekst}</button></div>`);
}
let bevestigActie = null;
function meld(t) { const l = $("#live"); if (l) { l.textContent = ""; setTimeout(() => (l.textContent = t), 30); } }

/* ===================================================================
   Widgets in de weetkaartjes
   =================================================================== */
function vulWidgets() {
  document.querySelectorAll("[data-widget]").forEach(el => {
    const w = el.dataset.widget;
    if (w === "wiel") el.innerHTML = `<svg viewBox="0 0 330 140" role="img" aria-label="Een wiel met middellijn 1 rolt één rondje en legt π af, ongeveer 3,14">
      <line x1="10" y1="110" x2="320" y2="110" style="stroke:var(--rand-licht)" stroke-width="4"/>
      <line x1="40" y1="110" x2="228.5" y2="110" class="wiel-touw" style="stroke:var(--oranje)" stroke-width="6" stroke-linecap="round"/>
      <line x1="40" y1="102" x2="40" y2="122" style="stroke:var(--tekst-zacht)" stroke-width="3"/>
      <line x1="228.5" y1="102" x2="228.5" y2="122" style="stroke:var(--tekst-zacht)" stroke-width="3"/>
      <text x="40" y="136" text-anchor="middle" style="fill:var(--tekst);font:800 13px var(--font)">0</text>
      <text x="228.5" y="136" text-anchor="middle" style="fill:var(--tekst);font:900 13px var(--font)">π ≈ 3,14</text>
      <g class="wiel-rol"><g class="wiel-draai">
        <circle r="29" style="fill:var(--wit);stroke:var(--blauw)" stroke-width="5"/>
        <line x1="-29" y1="0" x2="29" y2="0" style="stroke:var(--cyaan)" stroke-width="3"/>
        <circle cx="0" cy="29" r="5" style="fill:var(--oranje)"/>
      </g></g>
      <text x="40" y="22" style="fill:var(--tekst-zacht);font:800 12px var(--font)">middellijn = 1</text>
    </svg>`;
    if (w === "getallenlijn") {
      const x = v => 20 + (v - 3.1) / 0.08 * 290;
      const punten = [[3.125, "Babylonië 3,125", "var(--accent)", 30], [3.14159, "π = 3,14159…", "var(--oranje)", 58], [3.1605, "Egypte 3,16", "var(--accent)", 30]];
      el.innerHTML = `<svg viewBox="0 0 330 120" role="img" aria-label="Getallenlijn: Babylonië 3,125, π 3,14159, Egypte 3,16">
        <line x1="20" y1="90" x2="310" y2="90" style="stroke:var(--tekst-zacht)" stroke-width="3"/>
        ${[3.1, 3.12, 3.14, 3.16, 3.18].map(v => `<line x1="${x(v)}" y1="84" x2="${x(v)}" y2="96" style="stroke:var(--tekst-zacht)" stroke-width="2"/><text x="${x(v)}" y="114" text-anchor="middle" style="fill:var(--tekst-zacht);font:800 12px var(--font)">${String(v).replace(".", ",")}</text>`).join("")}
        ${punten.map(([v, t, k, y]) => `<line x1="${x(v)}" y1="${y + 6}" x2="${x(v)}" y2="90" style="stroke:${k}" stroke-width="2" stroke-dasharray="3 3"/><circle cx="${x(v)}" cy="90" r="7" style="fill:${k}"/><text x="${x(v)}" y="${y}" text-anchor="middle" style="fill:var(--tekst);font:900 12.5px var(--font)">${t}</text>`).join("")}
      </svg>`;
    }
    if (w === "veelhoek") tekenVeelhoek(el, 6);
    if (w === "steen") el.innerHTML = `<p style="font-weight:800">Hier ligt begraven Ludolph van Ceulen</p><p class="zacht" style="color:inherit;opacity:.85">π ligt tussen</p><p class="getal">3,14159265358979323846264338327950288</p><p class="zacht" style="color:inherit;opacity:.85">en</p><p class="getal">3,14159265358979323846264338327950289</p>`;
    if (w === "zoek") el.innerHTML = `<label class="label" for="zoekveld">Typ 1 tot 6 cijfers</label>
      <div class="rij"><input class="veld cijfers" id="zoekveld" inputmode="numeric" maxlength="6" placeholder="bijv. 42" style="flex:1;min-width:0;max-width:240px" autocomplete="off"></div>
      <p class="zoek-uitkomst" id="zoek-uitkomst" aria-live="polite"></p>`;
  });
}
function tekenVeelhoek(el, n) {
  const R = 80, cx = 100, cy = 100;
  const pts = r => Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`; }).join(" ");
  const buiten = R / Math.cos(Math.PI / n);
  const ib = (n * Math.sin(Math.PI / n)).toFixed(4).replace(".", ","), ob = (n * Math.tan(Math.PI / n)).toFixed(4).replace(".", ",");
  el.innerHTML = `<svg viewBox="0 0 200 200" style="max-width:260px" role="img" aria-label="Cirkel met een ${n}-hoek erbinnen en eromheen">
      <polygon points="${pts(buiten)}" style="fill:none;stroke:var(--oranje)" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="${R}" style="fill:var(--wit);stroke:var(--tekst)" stroke-width="2"/>
      <polygon points="${pts(R)}" style="fill:var(--cyaan-licht);stroke:var(--blauw)" stroke-width="2.5"/>
    </svg>
    <div class="veelhoek-knoppen" role="group" aria-label="Aantal hoeken">${[6, 12, 24, 48, 96].map(k => `<button data-act="veelhoek" data-n="${k}" aria-pressed="${k === n}">${k}</button>`).join("")}</div>
    <p class="veelhoek-uitkomst"><span style="color:var(--link)">Binnen: ${ib}</span> &lt; π &lt; <span style="color:var(--oranje-donker)">Buiten: ${ob}</span></p>`;
}
function zoekInPi(q) {
  const out = $("#zoek-uitkomst"); if (!out) return;
  q = q.replace(/\D/g, "");
  if (!q) { out.textContent = ""; return; }
  const i = DECIMALEN.indexOf(q);
  out.innerHTML = i >= 0 ? `🎉 Gevonden! <b>${esc(q)}</b> begint bij decimaal <b>${i + 1}</b>.` : `Niet gevonden in de eerste 1000 decimalen. Probeer een ander getal!`;
}

/* ===================================================================
   Navigatie en acties
   =================================================================== */
function toepasThema() {
  const t = store.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
/* ---------- Vegen of de terugknop van de telefoon = "Terug" in de app ----------
   Buiten het startscherm staat er altijd één extra stap in de geschiedenis van de browser.
   Veegt het kind terug, dan vangen we dat op en gaan we binnen de app terug, in plaats van de app te sluiten. */
const terugAan = (() => { try { return window.top === window && !!history.pushState; } catch (e) { return false; } })();
let extraStap = false, negeerTerug = false;
function zorgExtraStap() {
  if (!terugAan || extraStap) return;
  if (negeerTerug) { setTimeout(zorgExtraStap, 60); return; }   // er loopt nog een stap terug: even wachten
  try { history.pushState({ piTrainer: true }, ""); extraStap = true; } catch (e) {}
}
function haalExtraStapWeg() {
  if (!terugAan || !extraStap) return;
  extraStap = false; negeerTerug = true;
  try { history.back(); } catch (e) { negeerTerug = false; }
}
function terugDoel(view) {
  if (view === "card") return "cards";
  if (view === "profiles" && !prof()) return null;
  return "home";
}
if (terugAan) window.addEventListener("popstate", () => {
  if (negeerTerug) { negeerTerug = false; return; }
  extraStap = false;
  // Een venster open? Dan sluit terugvegen alleen het venster
  if ($("#modal-plek").innerHTML) { sluitModal(); if (state.view !== "home") zorgExtraStap(); return; }
  // Midden in een toets: eerst vragen, zodat een per ongeluk geveegde toets niet verloren gaat
  if (state.view === "test" && state.test && (state.test.fase === "spelen" || state.test.fase === "kijken")) {
    zorgExtraStap();
    bevestig("Stoppen met de toets?", "Je stopt met deze toets. Wat je nu typte, telt niet mee.", "Ja, stoppen", () => ACTIES.stoptoets());
    return;
  }
  const doel = terugDoel(state.view);
  if (!doel || doel === state.view) return;
  if (state.view === "test") { stopSpraak(); state.test = null; }
  ga(doel);
});

function ga(view) {
  if (state.view === "test" && view !== "test") stopSpraak();
  state.view = view;
  if (view === "home" || !prof()) haalExtraStapWeg(); else zorgExtraStap();
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
  // Op een telefoon schuift de toets net onder de kop door, zodat het hele toetsenbord in beeld past
  if (view === "test" && window.innerWidth <= 560) {
    const kaart = document.querySelector("#app > .kaartje");
    if (kaart) window.scrollTo({ top: Math.max(0, kaart.getBoundingClientRect().top + window.scrollY - 6), behavior: "auto" });
  }
}
function render() {
  toepasThema();
  const p = prof();
  if (!p) state.view = "profiles";
  $("#profielknop").hidden = !p;
  if (p) $("#profielnaam").textContent = p.name;
  const v = { diploma: vDiploma, profiles: vProfiles, home: vHome, lijst: vLijst, study: vStudy, test: vTest, full: vFull, practice: vPractice, badges: vBadges, cards: vCards, card: vCard, settings: vSettings }[state.view] || vHome;
  document.body.classList.toggle("in-toets", state.view === "test");
  document.body.classList.toggle("op-diploma", state.view === "diploma");
  $("#app").innerHTML = v(p);
  if (state.view === "test") tekenToets();
  if (state.view === "card") vulWidgets();
}

const ACTIES = {
  go: el => { if (el.dataset.to === "profiles") state.nieuwForm = false; state.code = null; state.codeMelding = ""; ga(el.dataset.to); },
  study: () => { state.verstopt.clear(); ga("study"); },
  mode: el => { const p = prof(); p.mode = el.dataset.mode; bewaar(); document.querySelectorAll('[data-act="mode"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === p.mode)); },
  flip: el => { const i = +el.dataset.i; state.verstopt.has(i) ? state.verstopt.delete(i) : state.verstopt.add(i); const weg = state.verstopt.has(i); el.setAttribute("aria-pressed", weg); el.querySelector(".vlak").textContent = weg ? "?" : cijfer(i); },
  flipall: el => {
    const p = prof();
    let a, b;
    if (el.dataset.a) { a = +el.dataset.a; b = +el.dataset.b; } else { const g = groepje(p); a = g.start; b = g.end; }
    const alles = Array.from({ length: b - a + 1 }, (_, k) => a + k).every(i => state.verstopt.has(i));
    for (let i = a; i <= b; i++) alles ? state.verstopt.delete(i) : state.verstopt.add(i);
    render();
  },
  startgroup: () => { const p = prof(); const g = groepje(p); startToets("group", g.start, g.end, p.mode); },
  startcum: () => { const p = prof(); const g = groepje(p); const r = heleReeksBereik(g.end); startToets("cum", r.start, r.end, p.mode); },
  startfull: () => { const p = prof(); startToets("full", 1, MAX, p.mode); },
  stopfull: () => { const t = state.test; if (t && t.kind === "full" && t.fase === "spelen") { t.gestopt = true; eindig(false); } },
  flits: () => startFlits(),
  diploma: () => { sluitModal(); ga("diploma"); },
  printdiploma: () => { try { window.print(); } catch (e) {} },
  startpractice: () => { const s = state.oefen; if (s) startToets("practice", s.a, s.b, null); },
  kiesdoel: () => toonDoelKiezer(),
  doelsel: el => { el.closest(".doel-keuzes").querySelectorAll("[data-act=doelsel]").forEach(b => b.setAttribute("aria-pressed", b === el)); const e = $("#eigendoel"); if (e) e.value = ""; const f = $("#doel-fout"); if (f) f.hidden = true; },
  doelopslaan: () => {
    const p = prof(); const n = leesDoel(p.mastered); if (!n) return;
    p.goal = n; p.goalDone = p.mastered >= n ? n : 0; bewaar(); sluitModal(); render(); meld(`Je nieuwe doel is ${n} decimalen`);
  },
  herhaal: () => { const p = prof(); if (!p.mastered) return; state.oefen = { a: 1, b: p.mastered, alles: true }; startToets("practice", 1, p.mastered, null); },
  stoptoets: () => { stopSpraak(); state.test = null; ga("home"); },
  cijfer: el => typCijfer(el.dataset.d),
  mic: () => startSpraak(),
  micverder: () => startSpraak(true),
  spraakweg: el => { state.spraak.cijfers.splice(+el.dataset.i, 1); tekenSpraak(); },
  spraakwis: () => { stopSpraak(); state.spraak = null; tekenSpraak(); },
  spraakok: () => spraakControleer(),
  oefensel: el => { state.oefen = { a: +el.dataset.a, b: +el.dataset.b, alles: !!el.dataset.alles }; render(); },
  opencard: el => { state.cardId = el.dataset.id; ga("card"); },
  leeskaart: el => { sluitModal(); state.cardId = el.dataset.id; ga("card"); },
  veelhoek: el => tekenVeelhoek(el.closest("[data-widget]"), +el.dataset.n),
  sluitmodal: (el, e) => { if (el.classList.contains("modal-achter") && e.target !== el) return; sluitModal(); },
  bevestig: () => { sluitModal(); if (bevestigActie) bevestigActie(); bevestigActie = null; },
  kiesprofiel: el => { store.active = el.dataset.id; bewaar(); state.test = null; state.oefen = null; state.verstopt.clear(); ga("home"); },
  nieuwform: el => { state.nieuwForm = el.dataset.show === "1"; render(); },
  formsize: el => { document.querySelectorAll('[data-act="formsize"]').forEach(b => b.setAttribute("aria-pressed", b === el)); },
  hernoem: () => { const v = $("#hernoem").value.trim(); if (v) { prof().name = v; bewaar(); render(); meld("Naam opgeslagen"); } },
  size: el => { const p = prof(); p.size = +el.dataset.size; p.pending = null; state.oefen = null; bewaar(); render(); },
  toggle: el => { const k = el.dataset.key; store.settings[k] = !store.settings[k]; bewaar(); el.setAttribute("aria-checked", store.settings[k]); if (k === "sound" && store.settings.sound) geluid("groep"); },
  theme: el => { store.settings.theme = el.dataset.theme; bewaar(); render(); },
  maakcode: () => { state.code = maakCode(prof()); state.codeMelding = ""; render(); },
  kopieer: () => {
    const code = state.code;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); state.codeMelding = "Selecteer en kopieer de code zelf."; $("#codemelding").textContent = state.codeMelding; };
    try { navigator.clipboard.writeText(code).then(() => { $("#codemelding").className = ""; $("#codemelding").textContent = "✅ Gekopieerd!"; }, fallback); } catch (e) { fallback(); }
  },
  laadcode: () => {
    const d = leesCode($("#codeveld").value);
    if (!d) { state.codeMelding = "Deze code klopt niet. Kijk nog eens goed of je hem goed hebt overgenomen."; render(); return; }
    bevestig("Voortgang terugzetten?", `Met deze code ken je ${d.mastered} decimalen. De voortgang van ${esc(prof().name)} wordt vervangen.`, "Ja, zet terug", () => {
      const p = prof(); Object.assign(p, d, { pending: null }); p.goalDone = p.mastered >= p.goal ? p.goal : 0; bewaar(); state.codeMelding = "✅ Je voortgang is teruggezet!"; state.code = null; render();
    });
  },
  reset: () => bevestig("Nieuwe start?", `Alle voortgang, badges en records van ${esc(prof().name)} worden gewist. Dit kun je niet terugdraaien.`, "Ja, begin opnieuw", () => {
    const p = prof(); Object.assign(p, { mastered: 0, recM: 0, recS: 0, pending: null, seenCards: [], goalDone: 0 }); bewaar(); state.verstopt.clear(); ga("home");
  }),
  verwijder: () => bevestig("Profiel verwijderen?", `Het profiel van ${esc(prof().name)} wordt helemaal verwijderd. Dit kun je niet terugdraaien.`, "Ja, verwijder", () => {
    delete store.profiles[store.active]; store.active = Object.keys(store.profiles)[0] || null; bewaar(); state.nieuwForm = false; ga(store.active ? "profiles" : "profiles");
  })
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || !el.dataset.act) return;
  const f = ACTIES[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "nieuw-form") return;
  e.preventDefault();
  const naam = $("#naam").value.trim();
  if (!naam) { $("#naam-fout").hidden = false; $("#naam").focus(); return; }
  const size = +(document.querySelector('[data-act="formsize"][aria-pressed="true"]')?.dataset.size || 5);
  const doel = leesDoel(0);
  if (!doel) return;
  nieuwProfiel(naam, size, doel);
  state.nieuwForm = false;
  ga("home");
});
document.addEventListener("input", e => {
  if (e.target.id === "zoekveld") zoekInPi(e.target.value);
  if (e.target.id === "eigendoel") {
    if (e.target.value) document.querySelectorAll("[data-act=doelsel]").forEach(b => b.setAttribute("aria-pressed", "false"));

  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal-plek").innerHTML) { sluitModal(); return; }
  if (e.key === "Enter" && e.target.id === "eigendoel" && e.target.closest("#modal-plek")) { e.preventDefault(); ACTIES.doelopslaan(); return; }
  if (state.view !== "test" || !state.test || state.test.fase !== "spelen") return;
  if (e.target.matches("input, textarea") || $("#modal-plek").innerHTML) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); typCijfer(e.key); const b = document.querySelector(`.toets[data-d="${e.key}"]`); if (b) { b.style.transform = "translateY(4px)"; setTimeout(() => (b.style.transform = ""), 90); } }
});

/* Elke π in de tekst krijgt een eigen span, zodat hij in verhouding staat tot de letters eromheen.
   Werkt automatisch voor alles wat de app tekent (ook meldingen en vensters). */
const PI_OVERSLAAN = "title, head, svg, script, style, textarea, input, .pi, .pi-teken, .achtergrond-pi";
function piWrap(knoop) {
  const basis = knoop.nodeType === 3 ? knoop.parentElement : knoop;
  if (!basis || basis.nodeType !== 1 || basis.closest(PI_OVERSLAAN)) return;
  const lijst = [];
  if (knoop.nodeType === 3) { if (knoop.nodeValue.includes("π")) lijst.push(knoop); }
  else {
    const w = document.createTreeWalker(basis, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes("π") && !n.parentElement.closest(PI_OVERSLAAN) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    while (w.nextNode()) lijst.push(w.currentNode);
  }
  for (const n of lijst) {
    const frag = document.createDocumentFragment();
    n.nodeValue.split("π").forEach((stuk, i) => {
      if (i) { const sp = document.createElement("span"); sp.className = "pi"; sp.textContent = "π"; frag.appendChild(sp); }
      if (stuk) frag.appendChild(document.createTextNode(stuk));
    });
    n.replaceWith(frag);
  }
}
new MutationObserver(lijst => { for (const m of lijst) m.addedNodes.forEach(piWrap); }).observe(document.body, { childList: true, subtree: true });

// Controle bij het laden: zijn de decimalen intact?
if (DECIMALEN.length !== MAX || !DECIMALEN.startsWith("14159265358979")) console.error("Decimalen van π beschadigd");
if (!prof()) state.view = "profiles";
render();
// Het app-icoon linksboven in de kop: dezelfde afbeelding als op het beginscherm, in hoge resolutie
try { const hoog = document.querySelector('link[rel="apple-touch-icon"]')?.href; if (hoog) document.querySelector(".kop .app-icoon").src = hoog; } catch (e) {}
piWrap(document.body);
// Offline werken: alleen in de online versie (niet in een voorbeeldvenster)
try {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
} catch (e) {}
// Openingsscherm: na 3 seconden (of bij een tik) zacht weg
(function () {
  const sp = document.getElementById("splash");
  if (!sp) return;
  let klaar = false;
  const weg = () => { if (klaar) return; klaar = true; sp.classList.add("weg"); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener("click", weg);
  setTimeout(weg, 3000);
})();
